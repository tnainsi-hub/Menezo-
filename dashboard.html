<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menezo — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <aside id="sidebar-mount"></aside>
  <main>
    <div class="topbar" id="topbar-mount"></div>
    <div class="hero">
      <div class="hero-inner">
        <h1>Good <span id="greetTime">Evening</span>, <span id="displayName">Creator</span>! 👋 <a class="switch-link" href="login.html">switch</a></h1>
        <p><span id="displayHandle">@you</span> · <span id="displayPlatform">YouTube</span> · <span id="displayNiche">General</span></p>
        <div class="stat-row" id="statRow"></div>
      </div>
    </div>
    <div class="section-title"><h2>Platform Overview</h2></div>
    <div class="overview-grid" id="overviewGrid"></div>
    <div class="bottom-grid">
      <div class="card">
        <h3>Today's Focus</h3>
        <div id="taskList"></div>
        <div class="addtask">
          <input type="text" id="newTaskInput" placeholder="Add a task...">
          <button onclick="addTask()">Add</button>
        </div>
      </div>
      <div class="card">
        <h3>🤖 AI Talent Manager</h3>
        <div class="chat-log" id="chatLog" style="max-height:150px; overflow-y:auto; margin-bottom:10px;"></div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="chatInput" placeholder="Ask your AI manager anything..." style="flex:1; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:10px; padding:9px 11px; color:var(--text); font-size:12px;" onkeydown="if(event.key==='Enter')sendChat()">
          <button onclick="sendChat()" style="background:var(--grad); border:none; border-radius:10px; padding:0 14px; color:#fff; font-weight:700; cursor:pointer;">Ask</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="app.js"></script>
<script>
  const user = requireLogin();
  if (user) {
    renderSidebar('dashboard', user);
    renderTopbar(user);

    const first = (user.name || 'Creator').split(' ')[0];
    document.getElementById('displayName').textContent = first;
    document.getElementById('displayHandle').textContent = user.channelId;
    document.getElementById('displayPlatform').textContent = user.platform;
    document.getElementById('displayNiche').textContent = user.niche;
    document.getElementById('greetTime').textContent = greetingWord();

    document.getElementById('statRow').innerHTML = `
      <div class="stat"><div class="lbl">Followers</div><div class="num">${user.followers}</div><div class="delta">On ${user.platform}</div></div>
      <div class="stat"><div class="lbl">Creator Score</div><div class="num">${user.score || 50}</div><div class="delta">↑ Building momentum</div></div>
      <div class="stat"><div class="lbl">Tasks Today</div><div class="num" id="statTasks">0</div><div class="delta" id="statTasksDone">0 done</div></div>
    `;

    document.getElementById('overviewGrid').innerHTML = PLATFORMS.slice(0,4).map((p,i) => {
      const connected = p.key === user.platform;
      return `<div class="ov-card ${connected?'connected':'locked'}">
        ${!connected ? '<span class="ov-locked-tag">Connect</span>' : ''}
        <div class="ov-head"><span class="icon-badge ${p.cls}">${p.icon}</span>${p.key}</div>
        <div class="ov-num">${connected ? user.followers : '—'}</div>
        <div class="ov-lbl">${connected ? 'Followers' : 'Not connected'}</div>
      </div>`;
    }).join('');

    let tasks = JSON.parse(localStorage.getItem('menezo_tasks') || 'null') || [
      { text:"Finish today's script", done:false },
      { text:'Reply to top comments', done:false },
    ];
    function saveTasks(){ localStorage.setItem('menezo_tasks', JSON.stringify(tasks)); renderTasks(); }
    function renderTasks(){
      document.getElementById('taskList').innerHTML = tasks.map((t,i) => `
        <div class="task ${t.done?'done':''}" onclick="toggleTask(${i})">
          <span>${t.text}</span><span>${t.done?'✓':''}</span>
        </div>`).join('');
      document.getElementById('statTasks').textContent = tasks.length;
      document.getElementById('statTasksDone').textContent = tasks.filter(t=>t.done).length + ' done';
    }
    window.toggleTask = function(i){ tasks[i].done = !tasks[i].done; saveTasks(); };
    window.addTask = function(){
      const input = document.getElementById('newTaskInput');
      const v = input.value.trim();
      if (!v) return;
      tasks.push({ text:v, done:false });
      input.value = '';
      saveTasks();
    };
    renderTasks();

    function appendMsg(role, text){
      const log = document.getElementById('chatLog');
      const div = document.createElement('div');
      div.style.cssText = role==='user' ? 'background:rgba(124,58,237,.22); color:#e9d8ff; margin-left:20px; text-align:right; padding:8px 10px; border-radius:10px; margin-bottom:6px; font-size:12px;' : 'background:rgba(255,255,255,.04); color:#d8d2ea; padding:8px 10px; border-radius:10px; margin-bottom:6px; font-size:12px;';
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }
    window.sendChat = async function(){
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      appendMsg('user', msg);
      input.value = '';
      const reply = await askAIManager(msg, user);
      appendMsg('ai', reply);
    };
    appendMsg('ai', `Hi ${first}! Ask me for hooks, captions, or a content plan.`);
  }
</script>
</body>
</html>
