<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menezo Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .chat-box {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 340px;
      height: 440px;
      background: #14101f;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      display: none;
      flex-direction: column;
      z-index: 999;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .chat-header {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      padding: 12px 16px;
      border-radius: 16px 16px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: white;
    }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 80%;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.4;
    }
    .bubble.user {
      background: #7c3aed;
      color: white;
      align-self: flex-end;
    }
    .bubble.ai {
      background: #1a1428;
      border: 1px solid rgba(255,255,255,0.08);
      align-self: flex-start;
    }
    .chat-footer {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .chat-footer input {
      flex: 1;
      background: #0c0916;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px;
      color: white;
      font-size: 13.5px;
    }
    .chat-footer button {
      background: #7c3aed;
      border: none;
      border-radius: 10px;
      color: white;
      padding: 0 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar-mount"></aside>

    <main>
      <div class="topbar" id="topbar-mount"></div>

      <div class="hero">
        <div class="hero-inner">
          <h1>Good <span id="greetTime">Day</span>, <span id="displayName">Creator</span> 👋</h1>
          <p>
            <span id="displayHandle">@you</span> · 
            <span id="displayPlatform">YouTube</span> · 
            <span id="displayNiche">General</span>
          </p>
        </div>
      </div>

      <!-- Stats -->
      <div class="stat-row" id="statRow" style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;"></div>

      <!-- Platform Overview -->
      <div class="section-title"><h2>Platform Overview</h2></div>
      <div class="overview-grid" id="overviewGrid"></div>

      <!-- Today's Focus + Inspiration -->
      <div class="bottom-grid">
        <div class="card">
          <h3>Today's Focus</h3>
          <div id="taskList"></div>
          <div class="addtask">
            <input type="text" id="newTaskInput" placeholder="Add a task...">
            <button onclick="addTask()">Add</button>
          </div>
        </div>

        <div class="card">
          <h3>Inspiration</h3>
          <div id="insightList"></div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="section-title"><h2>Quick Actions</h2></div>
      <div class="quick-grid">
        <div class="quick-item" onclick="openChat()">🤖 AI Chat</div>
        <div class="quick-item" onclick="alert('Coming soon')">📝 Script</div>
        <div class="quick-item" onclick="alert('Coming soon')">✨ Caption</div>
        <div class="quick-item" onclick="alert('Coming soon')">🖼️ Thumbnail</div>
      </div>
    </main>
  </div>

  <!-- AI Chat -->
  <div class="chat-box" id="chatBox">
    <div class="chat-header">
      <span>Menezo AI</span>
      <span onclick="closeChat()" style="cursor:pointer;font-size:20px;">×</span>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="bubble ai">Hi! Main Menezo AI hoon. Script, title, ideas ya growth tips chahiye?</div>
    </div>
    <div class="chat-footer">
      <input type="text" id="chatInput" placeholder="Type here..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const user = requireLogin();
    if (!user) throw "Not logged in";

    // Fill header
    document.getElementById('displayName').textContent = user.name || 'Creator';
    document.getElementById('displayHandle').textContent = user.channelId || '@you';
    document.getElementById('displayPlatform').textContent = user.platform || 'YouTube';
    document.getElementById('displayNiche').textContent = user.niche || 'General';
    document.getElementById('greetTime').textContent = greetingWord();

    renderSidebar('dashboard', user);
    renderTopbar(user);

    // Stats
    document.getElementById('statRow').innerHTML = `
      <div class="stat"><div class="lbl">Followers</div><div class="num">${user.followers || '0'}</div></div>
      <div class="stat"><div class="lbl">Score</div><div class="num">${user.score || 50}</div></div>
    `;

    // Platforms
    document.getElementById('overviewGrid').innerHTML = PLATFORMS.slice(0,4).map(p => {
      const connected = p.key === user.platform;
      return `
        <div class="ov-card ${connected ? 'connected' : 'locked'}">
          <div class="ov-head">
            <span class="icon-badge \( {p.cls}"> \){p.icon}</span> ${p.key}
          </div>
          <div class="ov-num">${connected ? (user.followers || '0') : '—'}</div>
          <div class="ov-lbl">${connected ? 'Followers' : 'Not connected'}</div>
        </div>
      `;
    }).join('');

    // Tasks
    let tasks = JSON.parse(localStorage.getItem('menezo_tasks') || 'null') || [
      { text: "Finish today's script", done: false },
      { text: "Reply to comments", done: false }
    ];

    function renderTasks() {
      document.getElementById('taskList').innerHTML = tasks.map((t, i) => `
        <div class="task \( {t.done ? 'done' : ''}" onclick="toggleTask( \){i})">
          <span>${t.text}</span>
          <span>${t.done ? '✓' : ''}</span>
        </div>
      `).join('');
    }
    window.toggleTask = function(i) {
      tasks[i].done = !tasks[i].done;
      localStorage.setItem('menezo_tasks', JSON.stringify(tasks));
      renderTasks();
    };
    window.addTask = function() {
      const val = document.getElementById('newTaskInput').value.trim();
      if (!val) return;
      tasks.push({ text: val, done: false });
      document.getElementById('newTaskInput').value = '';
      localStorage.setItem('menezo_tasks', JSON.stringify(tasks));
      renderTasks();
    };
    renderTasks();

    // Insights
    document.getElementById('insightList').innerHTML = `
      <div class="insight"><span>↗ Emotional storytelling</span><span class="tag high">High</span></div>
      <div class="insight"><span>↗ Day in the life content</span><span class="tag rising">Rising</span></div>
      <div class="insight"><span>↗ Behind the scenes</span><span class="tag high">High</span></div>
    `;

    // Chat functions
    function openChat() {
      document.getElementById('chatBox').style.display = 'flex';
    }
    function closeChat() {
      document.getElementById('chatBox').style.display = 'none';
    }
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const body = document.getElementById('chatBody');
      body.innerHTML += `<div class="bubble user">${text}</div>`;
      input.value = '';
      body.scrollTop = body.scrollHeight;

      body.innerHTML += `<div class="bubble ai" id="loading">Thinking...</div>`;
      body.scrollTop = body.scrollHeight;

      try {
        const reply = await askAIManager(text, user);
        document.getElementById('loading').remove();
        body.innerHTML += `<div class="bubble ai">${reply}</div>`;
      } catch (e) {
        document.getElementById('loading').remove();
        body.innerHTML += `<div class="bubble ai">AI temporarily unavailable. Try again.</div>`;
      }
      body.scrollTop = body.scrollHeight;
    }
  </script>
</body>
</html>
